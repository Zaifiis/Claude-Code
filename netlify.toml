# Deploying Content Studio to Netlify.
#
# Netlify detects Next.js and applies its own runtime with no configuration, so
# this file only sets what is specific to this app. Do not pin the Next.js
# runtime here — Netlify keeps it current on every build.
#
# Before the site goes live, set STUDIO_PASSWORD under
# Site configuration → Environment variables. Without it the studio is open,
# and anyone with the URL can read and edit your scripts.

[build.environment]
  # A function's filesystem is read-only, so the ideas live in Netlify Blobs
  # instead of data/studio.json. Locally this is unset and the file is used.
  STUDIO_STORAGE = "blobs"
