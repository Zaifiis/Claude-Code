    <div class="row gap4">
      <div class="stack" style="text-align:right"><span class="eyebrow">Avg first response</span><span class="num strong" style="font-size:17px">${avgResp} min</span></div>
      <div class="stack" style="text-align:right"><span class="eyebrow">Avg follow-up rate</span><span class="num strong" style="font-size:17px">${pct(avgFollow,0)}</span></div>
      <div class="stack" style="text-align:right"><span class="eyebrow">Exposure</span><span class="num strong" style="font-size:17px;color:var(--neg)">${money(m.riskTotal)}</span></div>
    </div>
  </div>

  <div class="card">
    <div class="table-wrap"><table class="tbl"><thead><tr>
      ${AGENT_COLS.map(c => `<th class="sortable ${c.cls||""}" data-sort-agents="${c.key}" scope="col"
        aria-sort="${s.key===c.key?(s.dir===1?"ascending":"descending"):"none"}">${esc(c.label)}${s.key===c.key?`<span class="sort-ind">${s.dir===1?"▲":"▼"}</span>`:""}</th>`).join("")}
    </tr></thead><tbody>
      ${sorted.map(a => `<tr class="clickable" data-agent="${a.id}" tabindex="0">
        <td><span class="cell-agent">${avatarEl(a,"sm")}<span><span class="cell-primary" style="display:block">${esc(a.name)}</span><span class="t-xs muted">${esc(a.title)} · ${esc(a.teamName)}</span></span></span></td>
        <td class="num">${a.leads}</td>
        <td class="num ${a.respMin>30?"neg strong":a.respMin>20?"warn":""}">${a.respMin} min</td>
        <td class="num"><div class="row gap2" style="justify-content:flex-end">
          <div class="meter ${a.followUp>=.8?"pos":a.followUp>=.6?"warn":"neg"}" style="width:44px"><span style="width:${a.followUp*100}%"></span></div>
          <span class="${a.followUp<.6?"neg strong":""}">${pct(a.followUp,0)}</span></div></td>
        <td class="num">${a.showings}</td><td class="num">${a.offers}</td><td class="num">${a.closings}</td>
        <td class="num ${a.conv<.03?"neg strong":a.conv>=.07?"pos strong":""}">${pct(a.conv,1)}</td>
        <td class="num">${compact(a.pipeline)}</td>
        <td class="num strong" style="color:${a.riskAmt?"var(--neg)":"var(--ink-4)"}">${a.riskAmt?money(a.riskAmt):"—"}</td>
        <td>${agentStatusBadge(a.status)}</td>
      </tr>`).join("")}
    </tbody></table></div>
    <div class="card-foot"><span class="t-xs muted">Response time is the median minutes to first outbound contact. Follow-up rate is the share of assigned leads with a logged touch inside the cadence window. Click any agent to filter the rescue queue.</span></div>
  </div>

  <section class="section split-2">
    <div class="card">
      <div class="card-head"><div><h2 class="section-title">Revenue Risk by Agent</h2>
        <p class="section-sub">Exposure follows behaviour, not book size.</p></div></div>
      <div class="card-body">
        ${m.byAgent.filter(a=>a.amt>0).map(a => barRow(a.agent.name, a.amt, maxAgent, money(a.amt),
          a.amt > maxAgent*0.6 ? "var(--neg-2)" : a.amt > maxAgent*0.3 ? "var(--warn-2)" : "var(--brand-2)",
          `${compact(a.agent.pipeline)} pipeline · ${pct(a.agent.followUp,0)} follow-up`)).join("")}
      </div>
    </div>
    ${worst && worst.amt ? `<div class="card">
      <div class="card-head"><h2 class="section-title" style="color:var(--neg)">${ico("alert",15)} Highest risk agent</h2></div>
      <div class="card-body">
        <div class="row gap3">${avatarEl(worst.agent,"lg")}
          <div><div class="strong" style="font-size:15px;color:var(--ink)">${esc(worst.agent.name)}</div>
          <div class="t-xs muted">${esc(worst.agent.title)} · ${esc(worst.agent.teamName)}</div></div>
          <div class="spacer"></div>${agentStatusBadge(worst.agent.status)}</div>
        <div class="why crit" style="margin-top:13px">${ico("alert",14)}
          <span><strong>Reason:</strong> ${worst.leads.filter(l=>l.followUpOverdue).length} leads have no follow-up within 24 hours, and ${worst.leads.filter(l=>l.risk==="Critical").length} are already past 48 hours.</span></div>
        <div class="exposure" style="margin-top:13px">
          <div><div class="eyebrow">Est. pipeline</div><div class="ex-v">${money(sum(worst.leads,l=>l.value))}</div></div>
          <div><div class="eyebrow">Est. commission</div><div class="ex-v">${money(sum(worst.leads,l=>l.commission))}</div></div>
          <div><div class="eyebrow">At risk</div><div class="ex-v" style="color:var(--neg)">${money(worst.amt)}</div></div>
        </div>
        <div class="row gap2" style="margin-top:13px">
          <button class="btn btn-primary btn-sm" data-action="filter-agent" data-agent="${worst.agent.id}">Open ${worst.count} leads</button>
          <button class="btn btn-sm" data-action="reassign-agent" data-agent="${worst.agent.id}">Reassign book</button>
        </div>
        <p class="footnote">Reassignment in this demo re-points the leads locally and recalculates every roll-up on screen.</p>
      </div>
    </div>` : ""}
  </section>`;
}

/* ---- LISTINGS ----------------------------------------------------------- */
function pageListings(){
  const f = state.filters.health, q = state.query.trim().toLowerCase();
  let rows = DB.listings.filter(l => state.team === "all" || agentById(l.agentId).team === state.team);
  if (q) rows = rows.filter(l => (l.address + " " + l.hood + " " + agentById(l.agentId).name).toLowerCase().includes(q));
  if (f === "risk") rows = rows.filter(l => l.score < 55);
  if (f === "healthy") rows = rows.filter(l => l.score >= 75);
  const s = state.sort.listings;
  const sorted = sortRows(rows, s.key, s.dir, { address:l=>l.address, score:l=>l.score, price:l=>l.price, dom:l=>l.dom });
  const atRiskListings = rows.filter(l => l.score < 55).sort((a,b) => a.score - b.score);
  const totalVolume = sum(rows, l => l.price);

  return `
  <div class="page-head">
    <div>
      <h1 class="page-title">Listings</h1>
      <p class="page-sub">${rows.length} active listings · ${compact(totalVolume)} in listed volume · ${compact(commission(totalVolume))} in commission at stake</p>

      <th class="num sortable" data-sort-listings="price" scope="col">Price</th>

      <th class="num" scope="col">Showings</th><th class="num" scope="col">Offers</th>
      <th class="num" scope="col">Last activity</th><th scope="col">Agent</th>
      <th class="num sortable" data-sort-listings="score" scope="col">Health</th>
    </tr></thead><tbody>
      ${sorted.length ? sorted.map(l => `<tr class="clickable" data-listing="${l.id}" tabindex="0">
        <td><div class="cell-primary">${esc(l.address)}</div><div class="t-xs muted">${esc(l.hood)}${l.cuts?` · ${l.cuts} price reduction${l.cuts>1?"s":""}`:""}</div></td>
        <td class="num cell-primary">${money(l.price)}</td>
        <td class="num ${l.dom>=60?"neg strong":l.dom>=45?"warn":""}">${l.dom}</td>
        <td class="num">${l.views.toLocaleString()}<div class="t-xs ${l.viewTrend<0?"neg":"pos"}">${l.viewTrend>0?"+":""}${pct(l.viewTrend,0)}</div></td>
        <td class="num">${l.leads}</td>
        <td class="num">${l.showings}<div class="t-xs ${l.showTrend<0?"neg":"pos"}">${l.showTrend>0?"+":""}${pct(l.showTrend,0)}</div></td>
        <td class="num ${l.offers?"":"neg strong"}">${l.offers}</td>
        <td class="num">${hoursAgoLabel(l.lastHrs)}</td>
        <td>${agentCell(l.agentId)}</td>
        <td class="num"><div class="row gap2" style="justify-content:flex-end">${healthBadge(l.health)}<span class="strong num" style="min-width:24px">${l.score}</span></div></td>
      </tr>`).join("") : `<tr><td colspan="10">${emptyState("No listings match","Try clearing the health filter or the global search.")}</td></tr>`}
    </tbody></table></div>
    <div class="card-foot"><span class="t-xs muted">Health score (0–100) blends lead activity, showing activity, days on market, offer activity, price positioning and recent engagement. Below 55 needs a conversation with the seller.</span></div>
  </div>

  ${atRiskListings.length ? `<section class="section">
    ${sectionHead("Listing Health — needs attention", "Each score is broken into the six factors that produced it.")}
    <div class="split-3">${atRiskListings.slice(0,6).map(l => `
      <div class="card"><div class="card-body">
        <div class="row gap3" style="align-items:flex-start">
          ${ringScore(l.score, 56)}
          <div style="min-width:0;flex:1">
            <div class="strong truncate" style="font-size:13.5px;color:var(--ink)">${esc(l.address)}</div>
            <div class="t-xs muted" style="margin:2px 0 6px">${esc(l.hood)} · ${money(l.price)} · ${l.dom} DOM</div>
            ${healthBadge(l.health)}
          </div>
        </div>
        <div style="margin-top:12px">
          ${Object.entries({ "Lead activity":l.factors.views, "Showing activity":l.factors.showings, "Days on market":l.factors.dom,
                             "Offer activity":l.factors.offers, "Price positioning":l.factors.price, "Recent engagement":l.factors.engage })
            .map(([k,v]) => `<div class="row gap2" style="margin-bottom:5px">
              <span class="t-xs muted" style="width:104px;flex:none">${esc(k)}</span>

}

/* ---- ANALYTICS ---------------------------------------------------------- */
function pageAnalytics(){
  const share = teamShare();
  const totalLeads = sum(SOURCES, s => s.leads), totalComm = sum(SOURCES, s => s.commission),
        totalSpend = sum(SOURCES, s => s.spend), totalClose = sum(SOURCES, s => s.closings);
  const ranked = SOURCES.slice().sort((a,b) => b.commission - a.commission);
  const best = ranked[0], fb = SOURCES.find(s => s.name === "Facebook");
  const perLead = SOURCES.map(s => ({ ...s, cpl: s.spend/s.leads, perLead: s.commission/s.leads,
                                      roas: s.spend ? s.commission/s.spend : null, close: s.closings/s.leads }))
                         .sort((a,b) => b.perLead - a.perLead);
  const maxPerLead = Math.max(...perLead.map(s => s.perLead));
  const sp = speedModel();
  const speedRows = SPEED.map((s,i) => ({ label:s.band.replace(" minutes","m").replace(" hours","h").replace("Under ","<").replace("Over ",">"),
    value:s.conv, valueLabel:pct(s.conv), sub:`${Math.round(s.leads*share)} leads`,
    color:["#047857","#059669","#2563EB","#D97706","#B42318"][i],
    tip:`${pct(s.conv)} conversion · ${Math.round(s.leads*share)} leads · ${Math.round(s.leads*s.conv)} closings` }));

  return `
  <div class="page-head">
    <div>
      <h1 class="page-title">Analytics</h1>
      <p class="page-sub">Lead quality, source economics and response speed · ${esc(period().label)}</p>
    </div>
    <div class="row gap4">
      <div class="stack" style="text-align:right"><span class="eyebrow">Marketing spend</span><span class="num strong" style="font-size:17px">${money(Math.round(totalSpend*share))}</span></div>
      <div class="stack" style="text-align:right"><span class="eyebrow">Commission earned</span><span class="num strong" style="font-size:17px;color:var(--pos)">${money(Math.round(totalComm*share))}</span></div>
      <div class="stack" style="text-align:right"><span class="eyebrow">Blended ROAS</span><span class="num strong" style="font-size:17px">${(totalComm/totalSpend).toFixed(1)}×</span></div>
    </div>
  </div>

  <div class="stat-note" style="margin-bottom:14px">${ico("zap",16)}
    <span><strong>${best.name} generated ${pct(best.leads/totalLeads,0)} of lead volume but produced ${pct(best.commission/totalComm,0)} of closed commission.</strong>
    ${fb.name} is the mirror image: ${pct(fb.leads/totalLeads,0)} of volume, ${pct(fb.commission/totalComm,0)} of commission. Volume is not the same as revenue.</span></div>

  <div class="card">
    <div class="card-head"><div><h2 class="section-title">Lead Source Performance</h2>
      <p class="section-sub">Sorted by commission produced. Cost per closing is the number that should drive next month's budget.</p></div></div>
    <div class="table-wrap"><table class="tbl"><thead><tr>
      <th scope="col">Source</th><th class="num" scope="col">Leads</th><th class="num" scope="col">Qualified</th>
      <th class="num" scope="col">Showings</th><th class="num" scope="col">Offers</th><th class="num" scope="col">Closings</th>
      <th class="num" scope="col">Volume</th><th class="num" scope="col">Commission</th><th class="num" scope="col">Spend</th>
      <th class="num" scope="col">Cost / closing</th><th class="num" scope="col">Return</th>
    </tr></thead><tbody>
      ${ranked.map(s => {
        const roas = s.spend ? s.commission/s.spend : null;
        return `<tr>
          <td class="cell-primary">${esc(s.name)}</td>
          <td class="num">${Math.round(s.leads*share)}</td>
          <td class="num">${Math.round(s.qualified*share)}<div class="t-xs muted">${pct(s.qualified/s.leads,0)}</div></td>
          <td class="num">${Math.round(s.showings*share)}</td>

        </tr>`;

        <td class="cell-primary">Total</td><td class="num strong">${Math.round(totalLeads*share)}</td>

          `${Math.round(s.leads*share)} leads · ${s.closings} closings · ${pct(s.close,1)} close rate`)).join("")}
        <div class="stat-note pos" style="margin-top:12px">${ico("handshake",15)}
          <span><strong>Referral and Google Ads produce ${money(Math.round((SOURCES.find(s=>s.name==="Referral").commission + SOURCES.find(s=>s.name==="Google Ads").commission)))} on ${SOURCES.find(s=>s.name==="Referral").leads + SOURCES.find(s=>s.name==="Google Ads").leads} leads</strong> — ${pct((SOURCES.find(s=>s.name==="Referral").commission + SOURCES.find(s=>s.name==="Google Ads").commission)/totalComm,0)} of commission from ${pct((SOURCES.find(s=>s.name==="Referral").leads + SOURCES.find(s=>s.name==="Google Ads").leads)/totalLeads,0)} of volume.</span></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><div><h2 class="section-title">Where the budget goes vs. where revenue comes from</h2></div></div>
      <div class="card-body">
        <div class="legend" style="margin-bottom:10px"><span><i style="background:var(--ink-3)"></i>Share of spend</span><span><i style="background:var(--pos-2)"></i>Share of commission</span></div>
        ${SOURCES.filter(s=>s.spend>0).sort((a,b)=>b.spend-a.spend).map(s => `
          <div style="margin-bottom:9px">
            <div class="row gap2" style="justify-content:space-between;margin-bottom:3px">

              <span class="t-xs muted">${pct(s.spend/totalSpend,0)} spend → ${pct(s.commission/totalComm,0)} commission</span>
            </div>
            <div class="meter" style="height:7px;margin-bottom:3px"><span style="width:${(s.spend/totalSpend*100).toFixed(1)}%;background:var(--ink-3)"></span></div>
            <div class="meter" style="height:7px"><span style="width:${(s.commission/totalComm*100).toFixed(1)}%;background:var(--pos-2)"></span></div>

        <div class="stat-note neg" style="margin-top:12px">${ico("alert",15)}
          <span><strong>Facebook takes ${pct(fb.spend/totalSpend,0)} of paid budget and returns ${pct(fb.commission/totalComm,0)} of commission.</strong>
          Moving half of that spend to Google Ads at current performance models ${money(Math.round(fb.spend/2*(best.commission/best.spend)))} in additional commission.</span></div>
      </div>

  <section class="section">
    ${sectionHead("Speed to Lead", "Conversion rate by time to first outbound contact — Harborline's own trailing 12-month history.")}
    <div class="card"><div class="card-body">
      <div class="split-2" style="gap:20px">
        <div>${columnChart(speedRows, { title:"Conversion by response time", cssH:210 })}</div>
        <div class="stack gap3">

function logActivity(lead, type, text, tone = "info"){
  lead.activity.unshift({ hrs:0, type, text, tone, at:new Date(CFG.now.getTime()) });
}
function markContacted(id, silent = false){
  const l = leadById(id);
  if (!l || !l.riskAmt) return 0;
  const freed = l.riskAmt;
  l.recoveredAmt = (l.recoveredAmt || 0) + freed;
  l.recovered = true;
  l.riskAmt = 0; l.lossProb = 0; l.risk = "None";
  l.lastContactHrs = 0.05; l.lastContact = new Date(CFG.now.getTime());
  l.followUpOverdue = false;
  l.nextFollowUp = new Date(CFG.now.getTime() + 24*3600e3);
  l.nextAction = "Nurture";
  logActivity(l, "call", `${agentById(l.agentId).name} logged contact — ${money(freed)} of commission exposure recovered.`, "pos");
  if (!silent){
    toast("ok", "Contact logged", `${l.name} left the rescue queue. ${money(freed)} came off revenue at risk.`);
    animateQueueExit(id);
  }
  return freed;
}
function assignLead(id, agentId){
  const l = leadById(id), from = agentById(l.agentId), to = agentById(agentId);
  l.agentId = agentId;
  logActivity(l, "assign", `Reassigned from ${from.name} to ${to.name} by Michael Carter.`, "info");
  toast("info", "Lead reassigned", `${l.name} moved from ${from.name} to ${to.name}.`);
  refresh();
}
function changeStatus(id, status){
  const l = leadById(id), prev = l.status;
  l.status = status; l.stage = STAGES.includes(status) ? status : l.stage;
  logActivity(l, "note", `Status changed from ${prev} to ${status}.`, status === "Lost" ? "neg" : "pos");
  if (status === "Closed" || status === "Lost"){
    const freed = l.riskAmt;
    if (freed){ l.recoveredAmt = (l.recoveredAmt||0) + (status === "Closed" ? freed : 0); l.riskAmt = 0; l.risk = "None"; l.recovered = status === "Closed"; }
  }
  toast(status === "Lost" ? "warn" : "ok", "Status updated", `${l.name} is now ${status}.`);
  refresh();
}
function scheduleFollowUp(id, when, note){
  const l = leadById(id);
  l.nextFollowUp = when; l.followUpOverdue = false;
  logActivity(l, "calendar", `Follow-up scheduled for ${fmtDateTime(when)}${note ? " — " + note : ""}.`, "info");
  toast("ok", "Follow-up scheduled", `${l.name} — ${fmtDateTime(when)}.`);
  refresh();
}
function addNote(id, text){
  const l = leadById(id);
  l.notes.unshift({ at:new Date(CFG.now.getTime()), text });
  logActivity(l, "note", `Note added by Michael Carter: "${text.length > 90 ? text.slice(0,90)+"…" : text}"`, "info");
  toast("ok", "Note saved", `Added to ${l.name}'s file.`);
  refresh();
}
function contactAction(id, kind){
  const l = leadById(id);
  const verb = { call:"Call placed", text:"Text sent", email:"Email sent" }[kind];
  const body = { call:`Dialing ${l.phone}`, text:`Message queued to ${l.phone}`, email:`Draft opened for ${l.email}` }[kind];
  logActivity(l, kind, `${verb} by Michael Carter — ${kind === "call" ? l.phone : kind === "text" ? l.phone : l.email}.`, "info");
  toast("info", verb, `${body} · demo only, nothing is sent.`);
  renderPanel();
}
function animateQueueExit(id){
  const row = $(`tr[data-lead="${id}"]`);
  if (row && !prefersReduced()){
    row.classList.add("row-exiting");
    setTimeout(() => refresh(), 460);
  } else refresh();
}
function reassignBook(agentId){
  const from = agentById(agentId);
  const targets = DB.agents.filter(a => a.id !== agentId && a.followUp >= 0.8).sort((a,b) => a.leads - b.leads);
  const moving = DB.leads.filter(l => l.agentId === agentId && l.riskAmt > 0);
  openModal({
    title: `Reassign ${from.name}'s at-risk book`,
    body: `<p class="t-sm muted-2" style="margin-bottom:12px">${moving.length} leads carrying ${money(sum(moving,l=>l.riskAmt))} of exposure will be redistributed to the highest follow-up performers with capacity.</p>
      <div class="opt-list">${targets.slice(0,4).map(t => `<div class="opt is-on"><span class="avatar sm" style="background:${t.color}">${t.initials}</span>
        <span style="flex:1"><span class="strong" style="display:block">${esc(t.name)}</span>
        <span class="t-xs muted">${pct(t.followUp,0)} follow-up · ${t.respMin} min response · ${t.leads} active leads</span></span>
        <span class="badge badge-healthy">+${Math.ceil(moving.length/Math.min(4,targets.length))}</span></div>`).join("")}</div>`,
    confirm: "Reassign " + moving.length + " leads",
    onConfirm(){
      moving.forEach((l,i) => { l.agentId = targets[i % Math.min(4,targets.length)].id;
        logActivity(l, "assign", `Reassigned from ${from.name} by Michael Carter during book review.`, "info"); });
      toast("ok","Book reassigned",`${moving.length} leads moved off ${from.name} to ${Math.min(4,targets.length)} agents.`);
      refresh();
    }
  });
}

function searchAll(q){
  q = q.trim().toLowerCase();
  if (!q) return [];
  const out = [];
  DB.leads.filter(l => (l.name + " " + l.hood + " " + l.property + " " + l.source + " " + agentById(l.agentId).name).toLowerCase().includes(q))
    .sort((a,b) => b.riskAmt - a.riskAmt)
    .slice(0,6).forEach(l => out.push({ kind:"Lead", label:l.name,
      meta:`${l.type} · ${l.hood} · ${money(l.value)} · ${agentById(l.agentId).name}`,
      badge:l.riskAmt?money(l.riskAmt)+" at risk":"On track", tone:l.riskAmt?"neg":"pos", go:() => { go("rescue"); openLead(l.id); } }));
  DB.agents.filter(a => (a.name + " " + a.teamName + " " + a.title).toLowerCase().includes(q))
    .slice(0,4).forEach(a => {
      const amt = sum(DB.leads.filter(l => l.agentId === a.id), l => l.riskAmt);
      out.push({ kind:"Agent", label:a.name, meta:`${a.title} · ${a.teamName} · ${a.leads} leads · ${pct(a.followUp,0)} follow-up`,
        badge: amt ? money(amt)+" at risk" : "No exposure", tone: amt ? "neg":"pos",
        go:() => { state.filters.agent = a.id; go("rescue"); } });
    });
  DB.listings.filter(l => (l.address + " " + l.hood).toLowerCase().includes(q))
    .slice(0,5).forEach(l => out.push({ kind:"Listing", label:l.address,
      meta:`${l.hood} · ${money(l.price)} · ${l.dom} DOM · ${l.showings} showings`,
      badge:`Health ${l.score}`, tone:l.score<55?"neg":"pos", go:() => { state.query = l.address; go("listings"); } }));
  DB.deals.filter(d => d.riskAmt > 0 && (d.address + " " + d.hood + " " + d.name).toLowerCase().includes(q))
    .slice(0,4).forEach(d => out.push({ kind:"Deal", label:d.address,
      meta:`${d.stage} · ${d.name} · ${money(d.price)} · idle ${d.daysIdle}d`,
      badge:money(d.riskAmt)+" at risk", tone:"neg", go:() => { go("pipeline"); openLead(d.leadId); } }));
  return out;
}

  state.tour.on = false;
  tourScrim.classList.remove("is-on");

function showTourStep(i){
  if (!state.tour.on) return;
  if (i >= TOUR.length){ endTour(); toast("ok","Demo complete","Revenue at risk recalculated from the recovered lead."); return; }
  state.tour.step = i;
  const st = TOUR[i];
  if (st.before) st.before();
  if (st.action) st.action();
  const place = () => {
    const t = $(st.sel);
    if (!t){ positionCoach(null, i); return; }
    t.scrollIntoView({ block:"center", behavior: prefersReduced() ? "auto" : "smooth" });
    setTimeout(() => {
      const r = t.getBoundingClientRect();
      const pad = 6;
      spot.style.left = (r.left - pad) + "px";
      spot.style.top = (r.top - pad) + "px";
      spot.style.width = (r.width + pad*2) + "px";
      spot.style.height = (r.height + pad*2) + "px";
      spot.classList.add("is-on");
      positionCoach(r, i);
    }, prefersReduced() ? 10 : 320);
  };
  requestAnimationFrame(place);
}
function positionCoach(r, i){
  const st = TOUR[i];
  coach.innerHTML = `
    <div class="coach-step">Guided demo · step ${i+1} of ${TOUR.length}</div>
    <div class="coach-title">${st.title}</div>
    <div class="coach-body">${st.body}</div>
    <div class="coach-foot">
      <div class="coach-dots">${TOUR.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
      <div class="spacer"></div>
      <button class="btn btn-sm" data-action="tour-end">End</button>
      ${i>0?`<button class="btn btn-sm" data-action="tour-back">Back</button>`:""}
      <button class="btn btn-sm btn-primary" data-action="tour-next">${i===TOUR.length-1?"Finish":"Next"} ${ico("arrowRight",12)}</button>
    </div>`;
  const cw = Math.min(360, window.innerWidth - 32), ch = coach.offsetHeight || 190;
  let left = 24, top = window.innerHeight - ch - 24;
  if (r){
    const tall = r.height > window.innerHeight * 0.55;
    const roomLeft = r.left - 24, roomRight = window.innerWidth - r.right - 24;
    if (tall && Math.max(roomLeft, roomRight) > cw){
      // very tall target (the side panel): sit beside it instead of covering it
      left = roomLeft >= roomRight ? r.left - cw - 18 : r.right + 18;
      top = clamp(r.top + r.height/2 - ch/2, 14, window.innerHeight - ch - 14);
    } else {
      left = clamp(r.left + r.width/2 - cw/2, 16, window.innerWidth - cw - 16);
      top = r.bottom + 14;
      if (top + ch > window.innerHeight - 14) top = Math.max(14, r.top - ch - 14);
    }
  }
  coach.style.left = left + "px"; coach.style.top = top + "px"; coach.style.width = cw + "px";
  coach.classList.add("is-on");
}

/* ---- event delegation --------------------------------------------------- */
document.addEventListener("click", e => {
  const t = e.target;

  /* rows / cards that open records */
  const leadRow = t.closest("[data-lead]");
  const actionEl = t.closest("[data-action]");
  const act = actionEl ? actionEl.dataset.action : null;

  if (act){
    e.preventDefault();
    switch (act){
      case "nav": go(actionEl.dataset.page); return;
      case "goto-risk": go("risk"); return;
      case "goto-rescue": go("rescue"); return;
      case "goto-pipeline": go("pipeline"); return;
      case "goto-agents": go("agents"); return;
      case "leak": {
        const k = actionEl.dataset.leak;
        if (k === "all"){ Object.keys(state.filters).forEach(f => state.filters[f] = "all"); }
        else setLeak(k);
        if (state.page !== "rescue") go("rescue"); else refresh();
        return;
      }
      case "filter-agent": setLeak("all"); state.filters.leak = "all"; state.filters.agent = actionEl.dataset.agent; go("rescue"); return;
      case "reassign-agent": reassignBook(actionEl.dataset.agent); return;
      case "clear-filters":
        Object.keys(state.filters).forEach(f => state.filters[f] = "all");
        state.query = ""; $("#globalSearch").value = ""; refresh(); return;
      case "health": state.filters.health = actionEl.dataset.health; refresh(); return;
      case "stage": state.activeStage = actionEl.dataset.stage || null; refresh(); return;
      case "set-period": state.period = actionEl.dataset.period; closeAllDropdowns(); refresh();
        toast("info","Period updated", PERIODS[state.period].label + " — volume, revenue and pipeline figures recalculated."); return;
      case "set-team": state.team = actionEl.dataset.team; closeAllDropdowns(); state.filters.agent = "all"; refresh();
        toast("info","Team filter", teamName(state.team) + " — " + scopedAgents().length + " agents in view."); return;
      case "read-all": state.notifs.forEach(n => n.unread = false); $("#notifMenu").innerHTML = notifMenuHTML(); renderNav(); return;
      case "notif": {
        const n = state.notifs.find(x => x.id === actionEl.dataset.id);
        n.unread = false; closeAllDropdowns();
        if (n.go.type === "lead"){ const l = DB.leads.find(x => x.name === n.go.key); if (l){ go("rescue"); openLead(l.id); } }
        else if (n.go.type === "listing"){ state.query = n.go.key; $("#globalSearch").value = n.go.key; go("listings"); }
        else if (n.go.type === "agent"){ state.filters.agent = n.go.key; go("rescue"); }
        else go(n.go.key);
        renderNav(); return;
      }
      case "action-toggle":
      case "action-go": {
        const id = actionEl.dataset.act;
        const a = todaysActions().find(x => x.id === id);
        if (act === "action-toggle"){ state.actionsDone[id] = !state.actionsDone[id]; refresh(); return; }
        if (a) a.go();
        return;
      }
      case "insight": { const i = insights()[Number(actionEl.dataset.idx)]; if (i && i.go) i.go(); return; }
      case "panel-tab": state.panelTab = actionEl.dataset.tab; renderPanel(); return;
      case "close-panel": closeLead(); return;
      case "close-modal": closeModal(); return;
      case "confirm-modal": { const fn = modalConfirm; if (fn) fn(); return; }
      case "contact": contactAction(state.selectedLead, actionEl.dataset.kind); return;
      case "assign": assignModal(state.selectedLead); return;
      case "schedule": scheduleModal(state.selectedLead); return;
      case "status": statusModal(state.selectedLead); return;
      case "note": noteModal(state.selectedLead); return;
      case "mark-contacted": { const id = state.selectedLead; markContacted(id); renderPanel(); return; }
      case "listing-action": {
        const l = DB.listings.find(x => x.id === actionEl.dataset.listing);
        const kind = actionEl.dataset.kind;
        toast("ok", kind === "review" ? "Price review scheduled" : "Marketing refresh queued",
          `${l.address} — ${kind === "review" ? "seller call added to Thursday's agenda" : "new photo set and featured placement requested"}.`);
        return;
      }
      case "demo-mode": closeAllDropdowns(); demoModeModal(); return;
      case "run-demo": startTour(); return;
      case "export": closeAllDropdowns(); exportBrief(); return;
      case "reset-data": closeAllDropdowns(); resetData(); return;
      case "profile-menu": toggleDropdown("userMenu","userBtn",userMenuHTML); return;
      case "tour-next": showTourStep(state.tour.step + 1); return;
      case "tour-back": showTourStep(Math.max(0, state.tour.step - 1)); return;
      case "tour-end": endTour(); return;
    }
  }

  /* modal option pickers + follow-up quick presets (delegated once, no per-modal listeners) */
  const opt = t.closest(".opt[data-pick]");
  if (opt){
    const list = opt.closest(".opt-list");
    $$(".opt", list).forEach(x => { x.classList.remove("is-on"); x.setAttribute("aria-checked","false"); });
    opt.classList.add("is-on"); opt.setAttribute("aria-checked","true");
    return;
  }
  const quick = t.closest("[data-quick]");
  if (quick){
    const hrs = Number(quick.dataset.quick);
    const when = new Date(CFG.now.getTime() + hrs*3600e3);
    if (hrs === 24) when.setHours(9,0,0,0);
    const pad = n => String(n).padStart(2,"0");
    $("#fuDate").value = `${when.getFullYear()}-${pad(when.getMonth()+1)}-${pad(when.getDate())}`;
    $("#fuTime").value = `${pad(when.getHours())}:${pad(when.getMinutes())}`;
    $$("#modal .chip").forEach(c => c.classList.remove("is-on"));
    quick.classList.add("is-on");
    return;
  }

  /* search result */
  const sr = t.closest("[data-search-idx]");
  if (sr){ const h = searchHits[Number(sr.dataset.searchIdx)]; hideSearch(); if (h) h.go(); return; }

  /* table sorting */
  const sortTh = t.closest("[data-sort]");
  if (sortTh){ const k = sortTh.dataset.sort; const s = state.sort.rescue;
    s.dir = s.key === k ? -s.dir : (k === "name" || k === "property" || k === "type" ? 1 : -1); s.key = k; refresh(); return; }
  const sortAg = t.closest("[data-sort-agents]");
  if (sortAg){ const k = sortAg.dataset.sortAgents; const s = state.sort.agents;
    s.dir = s.key === k ? -s.dir : -1; s.key = k; refresh(); return; }
  const sortLi = t.closest("[data-sort-listings]");
  if (sortLi){ const k = sortLi.dataset.sortListings; const s = state.sort.listings;
    s.dir = s.key === k ? -s.dir : (k === "address" ? 1 : -1); s.key = k; refresh(); return; }

  /* agent row → filter rescue queue */
  const agentRow = t.closest("tr[data-agent]");
  if (agentRow){ state.filters.agent = agentRow.dataset.agent; setLeakKeepAgent(); go("rescue"); return; }

  /* lead row / deal card */
  if (leadRow && leadRow.dataset.lead){ openLead(leadRow.dataset.lead); return; }

  /* topbar dropdowns */
  if (t.closest("#dateBtn")) return toggleDropdown("dateMenu","dateBtn",dateMenuHTML);
  if (t.closest("#teamBtn")) return toggleDropdown("teamMenu","teamBtn",teamMenuHTML);
  if (t.closest("#notifBtn")) return toggleDropdown("notifMenu","notifBtn",notifMenuHTML);
  if (t.closest("#userBtn")) return toggleDropdown("userMenu","userBtn",userMenuHTML);
  if (t.closest("#navToggle")){
    const app = $("#app");
    app.classList.toggle("nav-open");
    if (app.classList.contains("nav-open")){
      const s = el("div","nav-scrim"); s.addEventListener("click", () => { app.classList.remove("nav-open"); s.remove(); });
      app.appendChild(s);
    } else { const s = $(".nav-scrim"); if (s) s.remove(); }
    return;
  }
  if (!t.closest(".dropdown") && !t.closest(".pop-anchor") && !t.closest("#globalSearch")) closeAllDropdowns();
});
function setLeakKeepAgent(){ const a = state.filters.agent; Object.keys(state.filters).forEach(f => state.filters[f] = "all"); state.filters.agent = a; }

/* filters (select elements) */
document.addEventListener("change", e => {
  const f = e.target.closest("[data-filter]");
  if (!f) return;
  state.filters[f.dataset.filter] = f.value;
  refresh();
});

/* global search input */
const onSearch = debounce(() => { state.query = $("#globalSearch").value; renderSearch();
  if (["rescue","listings"].includes(state.page)) refresh(); }, 130);
$("#globalSearch").addEventListener("input", onSearch);
$("#globalSearch").addEventListener("focus", () => { if ($("#globalSearch").value.trim()) renderSearch(); });
$("#globalSearch").addEventListener("keydown", e => {
  if (e.key === "ArrowDown"){ e.preventDefault(); moveSearchCursor(1); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); moveSearchCursor(-1); }
  else if (e.key === "Enter"){
    const items = $$("#searchResults .sr-item");
    const idx = state.searchCursor > -1 ? state.searchCursor : 0;
    if (items[idx]) items[idx].click();
  } else if (e.key === "Escape"){ hideSearch(); $("#globalSearch").blur(); }
});

/* keyboard shortcuts + accessibility */
document.addEventListener("keydown", e => {
  const typing = ["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName);
  if (e.key === "/" && !typing){ e.preventDefault(); $("#globalSearch").focus(); return; }
  if (e.key === "Escape"){
    if (state.tour.on) return endTour();
    if ($("#modal")) return closeModal();
    if ($("#leadPanel")) return closeLead();
    closeAllDropdowns();
    return;
  }
  if (state.tour.on && !typing){
    if (e.key === "ArrowRight" || e.key === "Enter"){ e.preventDefault(); showTourStep(state.tour.step + 1); }
    if (e.key === "ArrowLeft"){ e.preventDefault(); showTourStep(state.tour.step - 1); }
    return;
  }
  if ((e.key === "Enter" || e.key === " ") && !typing){
    const row = document.activeElement.closest && document.activeElement.closest("tr[data-lead],tr[data-agent],[data-action]");
    if (row && document.activeElement === row){ e.preventDefault(); row.click(); }
  }
  if (!typing && !e.metaKey && !e.ctrlKey){
    const n = Number(e.key);
    if (n >= 1 && n <= PAGES.length){ go(PAGES[n-1].id); }
  }
});

/* drag & drop on the pipeline board */
let dragId = null;
document.addEventListener("dragstart", e => {
  const c = e.target.closest("[data-drag]");
  if (!c) return;
  dragId = c.dataset.drag; c.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", dragId); } catch(err){}
});
document.addEventListener("dragend", e => {
  const c = e.target.closest("[data-drag]"); if (c) c.classList.remove("dragging");
  $$(".pipe-cards.drag-over").forEach(x => x.classList.remove("drag-over"));
  dragId = null;
});
document.addEventListener("dragover", e => {
  const z = e.target.closest("[data-drop]");
  if (!z || !dragId) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "move";
  $$(".pipe-cards.drag-over").forEach(x => x.classList.remove("drag-over"));
  z.classList.add("drag-over");
});
document.addEventListener("drop", e => {
  const z = e.target.closest("[data-drop]");
  if (!z || !dragId) return;
  e.preventDefault();
  const stage = z.dataset.drop, l = leadById(dragId);
  z.classList.remove("drag-over");
  if (l && l.stage !== stage){
    const prev = l.stage;
    changeStatus(l.id, stage);
    const i = PIPELINE.findIndex(s => s.stage === prev), j = PIPELINE.findIndex(s => s.stage === stage);
    if (i > -1 && PIPELINE[i].count > 0){ PIPELINE[i].count--; PIPELINE[i].value = Math.max(0, PIPELINE[i].value - l.value*0.12); }
    if (j > -1){ PIPELINE[j].count++; PIPELINE[j].value += l.value*0.12; }
    refresh();
  }
  dragId = null;
});
window.addEventListener("resize", debounce(() => { if (state.tour.on) showTourStep(state.tour.step); }, 160));

/* ---- boot --------------------------------------------------------------- */
function boot(){
  render();
  setTimeout(() => {
    const m = metrics();
    toast("warn", `${money(m.riskTotal)} of commission is at risk today`,
      `${m.overdueCount} follow-ups overdue · ${m.overdueHighValue} high-value leads untouched for 24h+`);
  }, 900);
  setTimeout(() => {
    toast("info", "Guided demo available", "Press Run demo in the header to walk the full recovery story.");
  }, 6200);
}
boot();
</script>
</body>
</html>
